[tool.poetry]
name = "docker-prioritizer"
version = "0.1.0"
description = "A Trade-off-Aware Approach for Prioritized Refactoring of Dockerfiles"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
typer = {extras = ["all"], version = "^0.12.0"}
pydantic = "^2.5.0"
pandas = "^2.1.0"
pyyaml = "^6.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.9.0"

[tool.poetry.scripts]
docker-prioritizer = "src.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
